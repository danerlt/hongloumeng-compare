name: Build and Deploy to GitHub Pages

# 每次推送到 main 自动构建并部署到 GitHub Pages。
# 需要在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"（一次性设置）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取数据（脂本/程高 clone，癸酉取自仓库根目录 docx）
        run: bash scripts/fetch_data.sh
      - name: 解析与构建
        run: |
          python scripts/parse_tex.py
          python scripts/extract_local.py
          python scripts/build_all.py
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
