<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>红楼梦 · 三版本字符校读 · 前八十回</title>
<style>
:root{
  --paper:#f5f0e6;        /* 宣纸暖底 */
  --paper-2:#fbf7ee;      /* 稍亮纸面 */
  --ink:#23201b;          /* 墨色 */
  --ink-soft:#574f44;     /* 次墨 */
  --muted:#938979;        /* 暖灰 */
  --cinnabar:#9e2b22;     /* 朱砂 */
  --cinnabar-2:#b8473c;   /* 浅朱 */
  --line:#e2d9c6;         /* 暖分隔线 */
  --line-soft:#ece4d4;
  --mid-bg:#fffdf6;       /* 中栏基准底 */
  --hl-y:#f6d873;         /* 改字·藤黄(重彩) */
  --hl-y-bd:#c79f33;
  --hl-g:#bbd897;         /* 新增·石绿(重彩) */
  --hl-g-bd:#82a85e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;
  font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",STSong,"SimSun",serif;
  color:var(--ink);background:var(--paper);
  font-feature-settings:"halt";text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}

/* ===== 侧栏：书册目录 ===== */
.sidebar{width:266px;flex:0 0 266px;background:var(--paper-2);
  border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand .seal{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  background:var(--cinnabar);color:#fff;border-radius:4px;font-size:21px;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.brand .brand-t{font-size:19px;font-weight:700;letter-spacing:.14em;line-height:1.2}
.brand .brand-s{font-size:11px;color:var(--muted);letter-spacing:.18em;margin-top:3px}
.sidebar h2{font-size:12px;margin:0;padding:14px 18px 8px;color:var(--muted);font-weight:600;letter-spacing:.16em}
.sidebar ul{list-style:none;margin:0;padding:0 0 24px}
.sidebar li{padding:9px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;
  font-size:13px;line-height:1.5;color:var(--ink-soft);transition:background .12s}
.sidebar li:hover{background:#f0e9da}
.sidebar li.active{background:#efe6d2;color:var(--ink);box-shadow:inset 3px 0 0 var(--cinnabar)}
.sidebar .navnum{display:block;font-size:11px;color:var(--cinnabar-2);letter-spacing:.08em;margin-bottom:1px}
.sidebar li.active .navnum{color:var(--cinnabar)}

/* ===== 主区 ===== */
.main{flex:1;min-width:0;padding:0 0 64px}
.head{padding:22px 30px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);
  position:sticky;top:0;z-index:5}
.head .ttl{font-size:23px;font-weight:700;margin:0 0 9px;letter-spacing:.04em;color:var(--ink)}
.head .ttl .hui{color:var(--cinnabar);font-size:16px;margin-right:10px;letter-spacing:.1em;
  border:1px solid var(--cinnabar);border-radius:3px;padding:1px 7px;vertical-align:2px;font-weight:600}
.vt{font-size:12.5px;color:var(--ink-soft);line-height:1.85;display:flex;flex-wrap:wrap;gap:4px 16px}
.vt .vt-i{display:inline-flex;gap:6px}
.vt .vt-k{color:var(--muted);font-size:11px;letter-spacing:.08em;white-space:nowrap}
.vt b{font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:12px;align-items:center;color:var(--ink-soft)}
.legend>b{font-weight:600;color:var(--ink)}
.legend .k{padding:1px 7px;border-radius:2px;border:1px solid var(--line)}
.k.kg{background:var(--hl-g);border-color:var(--hl-g-bd)}
.k.ky{background:var(--hl-y);border-color:var(--hl-y-bd)}
.k.ku{text-decoration:underline;text-decoration-color:var(--cinnabar);text-decoration-thickness:2px;text-underline-offset:3px}
.k.kd{background:#f6e9e4;border-color:#d9a99f;color:var(--cinnabar);font-size:11px}
.k.ka{color:var(--muted);font-size:11px;background:#efe7d6;border:1px solid var(--line)}
.controls{margin-top:12px;font-size:12.5px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.controls label{cursor:pointer;user-select:none;color:var(--ink-soft)}
.controls input{accent-color:var(--cinnabar);vertical-align:-1px}
.controls .stat{color:var(--muted);letter-spacing:.04em}

/* ===== 三栏校读 ===== */
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:#efe6d3;border-bottom:1.5px solid #d6c9ad;
  padding:10px 16px;font-size:14px;font-weight:700;width:33.33%;color:var(--ink);letter-spacing:.06em}
thead th .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px;letter-spacing:.02em}
td{vertical-align:top;padding:10px 16px;border-bottom:1px solid var(--line-soft);
  font-size:16px;line-height:2.05;word-break:break-all}
td.col-mid{background:var(--mid-bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
tr:hover td{background:#f7f1e3}
tr:hover td.col-mid{background:#fdfaf0}
/* 有差异的行：左缘朱砂标记条，便于一眼定位 */
tr.r-diff>td:first-child{box-shadow:inset 4px 0 0 var(--cinnabar)}
.hl-replace{background:var(--hl-y);border-radius:2px;padding:0 2px;font-weight:600;
  box-shadow:inset 0 -2px 0 var(--hl-y-bd)}
.hl-insert{background:var(--hl-g);border-radius:2px;padding:0 2px;font-weight:600;
  box-shadow:inset 0 -2px 0 var(--hl-g-bd)}
/* 基准被改/删的字：朱砂红 + 加粗下划线（朱批感，最醒目） */
u.base-diff{color:var(--cinnabar);font-weight:600;text-decoration:underline;
  text-decoration-color:var(--cinnabar);text-decoration-thickness:2.5px;text-underline-offset:3px}
.annot{color:var(--muted);font-size:12.5px;background:#efe7d5;border:1px solid var(--line);
  border-radius:3px;padding:0 4px;margin:0 2px;letter-spacing:.02em}
.col-del{background:#f6e7df}
.gap{color:var(--cinnabar-2);font-weight:600;font-size:13.5px;letter-spacing:.1em}
body.hide-annot .annot{display:none}
body.only-diff tr.r-same{display:none}
/* 全局搜索 */
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;max-width:440px;padding:8px 12px;border:1px solid var(--line);
  border-radius:7px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
.search-bar input:focus{outline:none;border-color:var(--cinnabar-2);box-shadow:0 0 0 2px rgba(158,43,34,.12)}
.search-bar button{padding:8px 15px;border:1px solid var(--line);background:var(--paper);
  border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink)}
.search-bar button:hover{background:#efe6d2}
.search-bar .qclr{color:var(--muted)}
#searchPanel{display:none;padding:6px 30px 48px}
#searchPanel.show{display:block}
.sr-head{font-size:13px;color:var(--ink-soft);padding:12px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sr-head b{color:var(--cinnabar)}
.sr-item{padding:11px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:7px;transition:background .12s}
.sr-item:hover{background:#f2ecdd}
.sr-ch{font-size:12px;color:var(--cinnabar);margin-right:12px;font-weight:600;white-space:nowrap}
.sr-tx{font-size:15.5px;color:var(--ink);line-height:1.85}
.sr-tx mark{background:var(--hl-y);color:inherit;padding:0 1px;border-radius:2px;font-weight:600;box-shadow:inset 0 -2px 0 var(--hl-y-bd)}
.sr-empty{padding:24px 4px;color:var(--muted);font-size:14px}
tr.hit td{animation:hitfade 2.2s ease}
@keyframes hitfade{0%,35%{background:#fbe7c0}100%{background:transparent}}
tr.hit td.col-mid{animation:hitfademid 2.2s ease}
@keyframes hitfademid{0%,35%{background:#fbe7c0}100%{background:var(--mid-bg)}}

/* 汉堡按钮 + 遮罩（仅窄屏显示） */
.menu-btn{display:none;position:fixed;top:11px;left:11px;z-index:40;width:42px;height:42px;
  align-items:center;justify-content:center;border:1px solid var(--line);background:var(--paper-2);
  color:var(--ink);border-radius:8px;font-size:18px;line-height:1;cursor:pointer;
  box-shadow:0 1px 5px rgba(60,40,20,.12)}
#overlay{display:none;position:fixed;inset:0;background:rgba(35,25,15,.4);z-index:30}
#overlay.show{display:block}

/* ===== 窄屏/移动端（≤860px）：抽屉导航 + 三栏卡片 ===== */
@media(max-width:860px){
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:0;left:-88%;width:84%;max-width:330px;height:100vh;z-index:35;
    transition:left .25s ease;box-shadow:2px 0 16px rgba(50,35,15,.22)}
  .sidebar.open{left:0}
  .sidebar li{font-size:14px;padding:12px 18px}
  .main{padding-bottom:40px}
  .head{position:static;padding:16px 16px 13px 62px}
  .head .ttl{font-size:18px}
  .search-bar input{max-width:none}
  #searchPanel{padding:6px 14px 40px}
  .legend{gap:8px 12px;font-size:11px;margin-top:9px}
  .controls{gap:14px;margin-top:11px}
  thead{display:none}
  table,tbody,tr,td{display:block;width:auto}
  tr{margin:11px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
    background:var(--paper-2);box-shadow:0 1px 3px rgba(60,40,20,.06)}
  tr.r-diff{border-left:4px solid var(--cinnabar)}
  tr.r-diff>td:first-child{box-shadow:none}
  tr:hover td,tr:hover td.col-mid{background:transparent}
  td{border:none;border-bottom:1px solid var(--line-soft);padding:10px 15px;
    font-size:16.5px;line-height:2;word-break:normal;overflow-wrap:anywhere}
  td:last-child{border-bottom:none}
  td.col-mid{background:#fffdf6;border-left:none;border-right:none}
  td::before{display:block;font-size:10.5px;color:var(--cinnabar-2);font-weight:700;
    margin-bottom:4px;letter-spacing:.1em}
  td.col-cg::before{content:"程高本"}
  td.col-mid::before{content:"脂本 · 基准"}
  td.col-gy::before{content:"癸酉本"}
}
</style></head>
<body>
<button id="menuBtn" class="menu-btn" aria-label="打开目录" aria-expanded="false">☰</button>
<div id="overlay"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="seal">红</span>
      <div><div class="brand-t">红楼梦</div><div class="brand-s">三版本字符校读</div></div>
    </div>
    <h2>目录 · 前八十回</h2>
    <ul>__NAV__</ul>
  </aside>
  <section class="main">
    <div class="head">
      <div class="search-bar">
        <input id="q" type="search" placeholder="全局搜索 80 回（如：手倦抛书 / 刘姥姥），回车检索">
        <button id="qbtn">搜索</button>
        <button id="qclr" class="qclr" style="display:none">清空 ×</button>
      </div>
      <h1 class="ttl" id="mainttl"></h1>
      <div class="vt" id="vt"></div>
      <div class="legend"><b>校读图例：</b>
        <span><span class="k ky">改字</span></span>
        <span><span class="k kg">新增</span></span>
        <span><span class="k ku">下划线</span>基准被改/删</span>
        <span><span class="k kd">（X无）</span>整句缺失</span>
        <span><span class="k ka">【批注】</span>脂批 · 不参与比对</span>
      </div>
      <div class="controls">
        <label><input type="checkbox" id="tgAnnot" checked> 显示脂批</label>
        <label><input type="checkbox" id="tgDiffOnly"> 仅显示有差异的行</label>
        <span class="stat" id="stat"></span>
      </div>
    </div>
    <div id="searchPanel"></div>
    <div id="content"></div>
  </section>
</div>
__TEMPLATES__
<script>
function loadCh(n){
  var tpl=document.getElementById('tpl'+n); if(!tpl)return;
  document.getElementById('content').innerHTML=tpl.innerHTML;
  document.getElementById('mainttl').innerHTML='<span class="hui">第'+n+'回</span>'+tpl.dataset.zt;
  document.getElementById('vt').innerHTML=
    '<span class="vt-i"><span class="vt-k">程高</span><b>'+tpl.dataset.ct+'</b></span>'+
    '<span class="vt-i"><span class="vt-k">脂本·基准</span><b>'+tpl.dataset.zt+'</b></span>'+
    '<span class="vt-i"><span class="vt-k">癸酉</span><b>'+tpl.dataset.gt+'</b></span>';
  document.getElementById('stat').textContent=tpl.dataset.stat;
  document.querySelectorAll('.sidebar li').forEach(function(li){li.classList.toggle('active',li.dataset.ch==n);});
  window.scrollTo(0,0);
}
var _sb=document.querySelector('.sidebar'),_ov=document.getElementById('overlay'),_mb=document.getElementById('menuBtn');
function setNav(open){_sb.classList.toggle('open',open);_ov.classList.toggle('show',open);_mb.setAttribute('aria-expanded',open?'true':'false');}
_mb.addEventListener('click',function(){setNav(!_sb.classList.contains('open'));});
_ov.addEventListener('click',function(){setNav(false);});
document.querySelectorAll('.sidebar li').forEach(function(li){
  li.addEventListener('click',function(){loadCh(li.dataset.ch);setNav(false);});
});
document.getElementById('tgAnnot').addEventListener('change',function(e){document.body.classList.toggle('hide-annot',!e.target.checked);});
document.getElementById('tgDiffOnly').addEventListener('change',function(e){document.body.classList.toggle('only-diff',e.target.checked);});

/* ===== 全局搜索（首次检索时就地建索引，零额外下载） ===== */
var Q=document.getElementById('q'),PANEL=document.getElementById('searchPanel'),
    CONTENT=document.getElementById('content'),QCLR=document.getElementById('qclr'),SIDX=null;
function buildIndex(){
  SIDX=[];
  for(var n=1;n<=80;n++){
    var tpl=document.getElementById('tpl'+n); if(!tpl)continue;
    var d=document.createElement('div'); d.innerHTML=tpl.innerHTML;
    var trs=d.querySelectorAll('tbody tr');
    for(var i=0;i<trs.length;i++){
      var tds=trs[i].getElementsByTagName('td');
      SIDX.push({n:n,i:i,a:trs[i].textContent,m:tds[1]?tds[1].textContent:trs[i].textContent});
    }
  }
}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function frag(text,q){
  var p=text.indexOf(q); if(p<0)p=0;
  var s=Math.max(0,p-14),e=Math.min(text.length,p+q.length+30);
  return (s>0?'…':'')+esc(text.slice(s,p))+'<mark>'+esc(text.slice(p,p+q.length))+'</mark>'+
         esc(text.slice(p+q.length,e))+(e<text.length?'…':'');
}
function doSearch(){
  var q=Q.value.trim(); if(!q){closeSearch();return;}
  if(!SIDX)buildIndex();
  var res=[],cap=400;
  for(var k=0;k<SIDX.length;k++){if(SIDX[k].a.indexOf(q)>=0){res.push(SIDX[k]);if(res.length>=cap)break;}}
  var h='<div class="sr-head">「<b>'+esc(q)+'</b>」找到 '+res.length+' 处'+(res.length>=cap?'（仅显示前 '+cap+'）':'')+' · 点击跳转并定位</div>';
  if(!res.length){h+='<div class="sr-empty">没有匹配的句子。可换个更短的词试试。</div>';}
  for(var k=0;k<res.length;k++){var r=res[k];
    h+='<div class="sr-item" data-n="'+r.n+'" data-i="'+r.i+'"><span class="sr-ch">第'+r.n+'回</span>'+
       '<span class="sr-tx">'+frag(r.m.indexOf(q)>=0?r.m:r.a,q)+'</span></div>';}
  PANEL.innerHTML=h; PANEL.classList.add('show'); CONTENT.style.display='none'; QCLR.style.display='';
  window.scrollTo(0,0);
}
function closeSearch(){PANEL.classList.remove('show'); CONTENT.style.display='';}
PANEL.addEventListener('click',function(e){
  var it=e.target.closest?e.target.closest('.sr-item'):null; if(!it)return;
  var n=+it.dataset.n,i=+it.dataset.i;
  closeSearch();
  loadCh(n);
  var trs=CONTENT.querySelectorAll('tbody tr');
  if(trs[i]){trs[i].scrollIntoView({block:'center'});
    trs[i].classList.add('hit'); setTimeout((function(t){return function(){t.classList.remove('hit');};})(trs[i]),2200);}
});
document.getElementById('qbtn').addEventListener('click',doSearch);
QCLR.addEventListener('click',function(){Q.value='';closeSearch();this.style.display='none';Q.focus();});
Q.addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});

loadCh(1);
</script>
</body></html>
